version: "3.9"

# 本地开发环境：PostgreSQL + Redis + API + 管理后台
# 用法：docker compose -f deploy/compose/docker-compose.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vertify
      POSTGRES_PASSWORD: vertify
      POSTGRES_DB: vertify
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6399:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../
      dockerfile: deploy/compose/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      VFT_ENV: dev
      VFT_CLIENT_ADDR: ":8080"
      VFT_ADMIN_ADDR: ":8081"
      VFT_DATABASE_URL: postgres://vertify:vertify@postgres:5432/vertify?sslmode=disable
      VFT_REDIS_URL: redis://redis:6379/0
      # 密钥通过 env_file / secrets 注入，绝不写入镜像：
      #   VFT_SIGN_KEYS / VFT_SIGN_ACTIVE_KID / VFT_KEX_KEYS / VFT_CARD_HMAC_KEY
      #   VFT_INITIAL_ADMIN_USER / VFT_INITIAL_ADMIN_PASSWORD
      VFT_INITIAL_ADMIN_USER: ${VFT_INITIAL_ADMIN_USER:-admin}
      VFT_INITIAL_ADMIN_PASSWORD: ${VFT_INITIAL_ADMIN_PASSWORD:?set in .env}
      VFT_SIGN_KEYS: ${VFT_SIGN_KEYS:?run cmd/keygen}
      VFT_SIGN_ACTIVE_KID: ${VFT_SIGN_ACTIVE_KID:-sign-a}
      VFT_KEX_KEYS: ${VFT_KEX_KEYS:?run cmd/keygen}
      VFT_CARD_HMAC_KEY: ${VFT_CARD_HMAC_KEY:?run cmd/keygen}
      VFT_CARD_ENC_KEYS: ${VFT_CARD_ENC_KEYS:?set card encryption key}
      VFT_CARD_ENC_ACTIVE_KID: ${VFT_CARD_ENC_ACTIVE_KID:?set active card encryption kid}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:9090:9090"

  worker:
    build:
      context: ../../
      dockerfile: deploy/compose/Dockerfile.api
    entrypoint: ["/worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VFT_DATABASE_URL: postgres://vertify:vertify@postgres:5432/vertify?sslmode=disable
      VFT_ENV: dev

  web:
    build:
      context: ../../apps/admin-web
      dockerfile: ../../deploy/compose/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
