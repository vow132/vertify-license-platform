apiVersion: apps/v1
kind: Deployment
metadata:
  name: vertify-api
  labels: { app: vertify-api }
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: vertify-api }
  template:
    metadata:
      labels: { app: vertify-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: client, containerPort: 8080 }
            - { name: admin, containerPort: 8081 }
            - { name: metrics, containerPort: 9090 }
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: VFT_ENV
              value: prod
            - name: VFT_CLIENT_ADDR
              value: ":8080"
            - name: VFT_ADMIN_ADDR
              value: ":8081"
            - name: VFT_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: VFT_DATABASE_URL }
            - name: VFT_REDIS_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: VFT_REDIS_URL }
            - name: VFT_MIGRATIONS_DIR
              value: /db/migrations
            - name: VFT_SKIP_MIGRATE
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /v1/bootstrap, port: client }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: client }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: vertify-api }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vertify-worker
  labels: { app: vertify-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: vertify-worker }
  template:
    metadata:
      labels: { app: vertify-worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/worker"]
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: VFT_ENV
              value: prod
            - name: VFT_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: VFT_DATABASE_URL }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: vertify-client
spec:
  selector: { app: vertify-api }
  ports:
    - { name: http, port: 80, targetPort: client }
---
apiVersion: v1
kind: Service
metadata:
  name: vertify-admin
spec:
  selector: { app: vertify-api }
  ports:
    - { name: http, port: 80, targetPort: admin }
---
apiVersion: v1
kind: Service
metadata:
  name: vertify-metrics
spec:
  selector: { app: vertify-api }
  ports:
    - { name: metrics, port: 9090, targetPort: metrics }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vertify-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: vertify-api }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vertify-api
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: vertify-api }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vertify-api
spec:
  podSelector:
    matchLabels: { app: vertify-api }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { name: ingress-nginx } }
      ports:
        - { port: 8080 }
        - { port: 8081 }
    - from:
        - namespaceSelector: { matchLabels: { name: monitoring } }
      ports:
        - { port: 9090 }
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
        - { port: 5432, protocol: TCP }
        - { port: 6379, protocol: TCP }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vertify-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/migrate", "up"]
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: VFT_ENV
              value: prod
            - name: VFT_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: VFT_DATABASE_URL }
            - name: VFT_MIGRATIONS_DIR
              value: /db/migrations
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
