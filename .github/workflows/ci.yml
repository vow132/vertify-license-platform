name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache-dependency-path: apps/license-api/go.sum }
      - name: vet & unit tests
        working-directory: apps/license-api
        run: |
          go vet ./...
          go test ./... -race -count=1
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: apps/license-api
      - name: integration tests (postgres + redis services)
        working-directory: apps/license-api
        env:
          VFT_TEST_DATABASE_URL: postgres://vertify:vertify@127.0.0.1:54329/vertify_test?sslmode=disable
          VFT_TEST_REDIS_URL: redis://127.0.0.1:6399/1
        run: |
          docker run -d --name pg -p 54329:5432 -e POSTGRES_USER=vertify -e POSTGRES_PASSWORD=vertify -e POSTGRES_DB=vertify_test postgres:16-alpine
          docker run -d --name rd -p 6399:6379 redis:7-alpine
          sleep 5
          go test -tags integration ./internal/integration/ -v -count=1

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/admin-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/admin-web/package-lock.json }
      - run: npm ci
      - run: npm run build

  sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S sdk/windows-cpp -B sdk/windows-cpp/build -A x64
      - name: build
        run: cmake --build sdk/windows-cpp/build --config Release
      - name: selftest
        run: sdk/windows-cpp/build/Release/selftest.exe

  docker:
    needs: [api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -f deploy/compose/Dockerfile.api -t vertify-api:${{ github.sha }} .
      - name: scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vertify-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: validate helm
        shell: bash
        run: |
          command -v helm >/dev/null 2>&1 || { echo "helm is required"; exit 1; }
          helm lint deploy/helm/vertify
          helm template vertify deploy/helm/vertify --set image.tag=${{ github.sha }} >/tmp/vertify-rendered.yaml
      - name: compose config
        shell: bash
        run: |
          # 仅用于 CI 配置校验的开发占位值，不包含任何真实密钥
          export VFT_INITIAL_ADMIN_USER=admin
          export VFT_INITIAL_ADMIN_PASSWORD=ci-dev-placeholder-password-123
          export VFT_SIGN_KEYS=sign-a:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          export VFT_KEX_KEYS=kex-a:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA*
          export VFT_CARD_HMAC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          export VFT_CARD_ENC_KEYS=card-enc-a:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA*
          export VFT_CARD_ENC_ACTIVE_KID=card-enc-a
          docker compose -f deploy/compose/docker-compose.yml config --quiet
