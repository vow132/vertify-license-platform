<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Lumistar 授权平台示例仪表盘</title>
  <desc id="desc">不含真实数据的管理后台示例界面。</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#101828" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#f0f2f5"/>
  <!-- ===== 深色侧栏 ===== -->
  <rect x="0" y="0" width="220" height="1000" fill="#101c30"/>
  <text x="22" y="52" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#ffffff">◆ Lumistar</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13.5">
