  <text x="320" y="850" fill="#34415f">2025-05-20 11:05</text><text x="490" y="850" fill="#6d45dc">DEMO-••••-••••</text><text x="700" y="850" fill="#34415f">Lumistar 标准</text><text x="890" y="850" fill="#34415f">标准版（半年）</text><text x="1100" y="850" fill="#34415f">演示客户 B</text><rect x="1300" y="832" width="64" height="26" rx="13" fill="#e7f8ef"/><text x="1314" y="850" fill="#17945a">已激活</text>
  <text x="320" y="900" fill="#34415f">2025-05-19 16:45</text><text x="490" y="900" fill="#6d45dc">DEMO-••••-••••</text><text x="700" y="900" fill="#34415f">Lumistar Pro</text><text x="890" y="900" fill="#34415f">专业版（年付）</text><text x="1100" y="900" fill="#34415f">演示代理商</text><rect x="1300" y="882" width="64" height="26" rx="13" fill="#f1f3f7"/><text x="1314" y="900" fill="#68748c">已失效</text></g>
