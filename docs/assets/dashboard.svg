    <text x="22" y="132" fill="#8fa0b8" font-size="12" font-weight="600">卡密业务</text>
    <text x="22" y="160" fill="#b9c4d4">产品管理</text><text x="22" y="188" fill="#b9c4d4">套餐管理</text><text x="22" y="216" fill="#b9c4d4">制作卡密</text><text x="22" y="244" fill="#b9c4d4">卡密管理</text>
    <text x="22" y="278" fill="#8fa0b8" font-size="12" font-weight="600">授权状态</text>
    <text x="22" y="306" fill="#b9c4d4">已激活授权</text>
    <text x="22" y="340" fill="#8fa0b8" font-size="12" font-weight="600">用户与渠道</text>
    <text x="22" y="368" fill="#b9c4d4">用户管理</text><text x="22" y="396" fill="#b9c4d4">代理商</text><text x="22" y="424" fill="#b9c4d4">管理员</text>
    <text x="22" y="458" fill="#8fa0b8" font-size="12" font-weight="600">安全运营</text>
    <text x="22" y="486" fill="#b9c4d4">风控与封禁</text><text x="22" y="514" fill="#b9c4d4">审计日志</text>
    <text x="22" y="548" fill="#8fa0b8" font-size="12" font-weight="600">运营工具</text>
    <text x="22" y="576" fill="#b9c4d4">公告与版本</text>
  </g>
  <rect x="12" y="900" width="196" height="64" rx="10" fill="#1a2a45" stroke="#2a3c5c"/>
