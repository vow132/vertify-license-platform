  <line x1="220" y1="56" x2="1600" y2="56" stroke="#e7eaef"/>
  <text x="244" y="34" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#7a8699">卡密业务 / <tspan fill="#1a2233" font-weight="600">仪表盘</tspan></text>
  <text x="1240" y="34" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" fill="#4a5568">System Administrator</text>
  <rect x="1382" y="16" width="76" height="24" rx="12" fill="#eef4ff"/><text x="1394" y="33" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" fill="#2563eb">超级管理员</text>
  <rect x="1470" y="14" width="76" height="28" rx="6" fill="#ffffff" stroke="#d5dae2"/><text x="1487" y="33" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12.5" fill="#4a5568">退出登录</text>
