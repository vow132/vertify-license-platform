    <rect x="710" y="420" width="40" height="250" rx="5" fill="url(#bar)"/><text x="730" y="412" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11.5" font-weight="600" fill="#1a2233">375</text>
    <rect x="792" y="478" width="40" height="192" rx="5" fill="url(#bar)"/><text x="812" y="470" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11.5" font-weight="600" fill="#1a2233">288</text>
