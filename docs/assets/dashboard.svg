  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#8a95aa"><text x="340" y="610">05-14</text><text x="440" y="610">05-15</text><text x="540" y="610">05-16</text><text x="640" y="610">05-17</text><text x="740" y="610">05-18</text><text x="840" y="610">05-19</text><text x="940" y="610">05-20</text></g>
  <text x="1065" y="370" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#16213e">风险事件概览</text><text x="1065" y="420" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#34415f">异常登录尝试 <tspan x="1440" fill="#e05858">6</tspan></text><line x1="1065" y1="438" x2="1465" y2="438" stroke="#edf0f6"/><text x="1065" y="475" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#34415f">非常用地区登录 <tspan x="1440" fill="#f49b16">4</tspan></text><line x1="1065" y1="493" x2="1465" y2="493" stroke="#edf0f6"/><text x="1065" y="530" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#34415f">设备指纹异常 <tspan x="1440" fill="#f49b16">2</tspan></text><line x1="1065" y1="548" x2="1465" y2="548" stroke="#edf0f6"/><text x="1065" y="585" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#34415f">卡密滥用风险 <tspan x="1440" fill="#315efb">0</tspan></text>
  <g filter="url(#shadow)"><rect x="292" y="665" width="1203" height="270" rx="16" fill="#fff"/></g><text x="320" y="708" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#16213e">最近授权记录</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14"><text x="320" y="750" fill="#7a879f">授权时间</text><text x="490" y="750" fill="#7a879f">卡密（部分）</text><text x="700" y="750" fill="#7a879f">产品</text><text x="890" y="750" fill="#7a879f">套餐</text><text x="1100" y="750" fill="#7a879f">授权对象</text><text x="1305" y="750" fill="#7a879f">状态</text><line x1="320" y1="765" x2="1465" y2="765" stroke="#edf0f6"/>
