<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Lumistar 授权平台示例仪表盘</title>
  <desc id="desc">不含真实数据的管理后台示例界面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315efb"/><stop offset="1" stop-color="#6d5dfc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1b2a54" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="250" height="1000" fill="#fff"/>
  <path d="M28 54a18 18 0 0 1 18-18h34a18 18 0 0 1 18 18v34a18 18 0 0 1-18 18H46a18 18 0 0 1-18-18z" fill="url(#blue)"/>
  <path d="M47 52h32v24L63 86 47 76z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <text x="112" y="73" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#16213e">Lumistar 授权平台</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="19" fill="#34415f">
    <rect x="18" y="140" width="214" height="58" rx="12" fill="#edf1ff"/><text x="60" y="177" fill="#315efb" font-weight="700">⌂  仪表盘</text>
    <text x="60" y="240">▣  产品与套餐</text><text x="60" y="302">▤  制卡记录</text><text x="60" y="364">▥  卡密管理</text><text x="60" y="426">✓  已激活授权</text><text x="60" y="488">♙  代理商</text><text x="60" y="550">♢  风控与审计</text><text x="60" y="612">⚙  安全设置</text>
  </g>
  <rect x="18" y="850" width="214" height="120" rx="14" fill="#f8faff" stroke="#e4e9f5"/>
  <text x="36" y="884" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#16213e">盾  企业版</text><text x="36" y="915" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#6c7893">示例环境 · 无真实数据</text><text x="36" y="945" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#315efb">查看版本详情 →</text>
  <line x1="250" y1="0" x2="250" y2="1000" stroke="#e7ebf4"/>
  <text x="292" y="78" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#16213e">欢迎回来，管理员</text>
  <text x="292" y="111" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#73809c">以下为演示数据，用于展示后台信息结构</text>
  <circle cx="1490" cy="55" r="22" fill="#ede5ff"/><text x="1482" y="63" font-family="Segoe UI,sans-serif" font-size="18" fill="#6d45dc">A</text><text x="1523" y="61" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#34415f">管理员⌄</text>
  <g filter="url(#shadow)">
    <rect x="292" y="150" width="285" height="145" rx="16" fill="#fff"/><rect x="598" y="150" width="285" height="145" rx="16" fill="#fff"/><rect x="904" y="150" width="285" height="145" rx="16" fill="#fff"/><rect x="1210" y="150" width="285" height="145" rx="16" fill="#fff"/>
  </g>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="320" y="190" font-size="16" fill="#596782">活跃授权</text><text x="320" y="244" font-size="38" font-weight="700" fill="#16213e">1,248</text><text x="320" y="274" font-size="14" fill="#16a66a">较上月 ↑ 18.6%</text>
  <text x="626" y="190" font-size="16" fill="#596782">在线设备</text><text x="626" y="244" font-size="38" font-weight="700" fill="#16213e">862</text><text x="626" y="274" font-size="14" fill="#16a66a">较上月 ↑ 12.3%</text>
  <text x="932" y="190" font-size="16" fill="#596782">本月制卡</text><text x="932" y="244" font-size="38" font-weight="700" fill="#16213e">3,680</text><text x="932" y="274" font-size="14" fill="#16a66a">较上月 ↑ 21.7%</text>
  <text x="1238" y="190" font-size="16" fill="#596782">风险事件</text><text x="1238" y="244" font-size="38" font-weight="700" fill="#16213e">12</text><text x="1238" y="274" font-size="14" fill="#e05858">较上月 ↑ 33.3%</text></g>
  <g filter="url(#shadow)"><rect x="292" y="330" width="720" height="300" rx="16" fill="#fff"/><rect x="1035" y="330" width="460" height="300" rx="16" fill="#fff"/></g>
  <text x="320" y="370" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#16213e">授权趋势（近 7 天）</text><text x="320" y="405" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#6d7891">● 活跃授权　 <tspan fill="#3d7af6">● 新增授权</tspan>　 <tspan fill="#f4a019">● 已失效授权</tspan></text>
